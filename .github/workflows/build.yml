name: Windows build and release
# 버전 태그를 만들지 않는다.
# 모든 push/PR: 빌드 + 테스트. main push: 고정 Release "Google-Photo-Uploader (main)"의 zip을 새 빌드로 교체한다.
# (GitHub Release에는 태그가 필요하므로 내부용 고정 태그 uploader-main을 매번 최신 커밋으로 옮긴다.)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: uploader-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: uploader-main
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build name
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $branch = '${{ github.ref_name }}' -replace '[^A-Za-z0-9._-]', '-'
          "GPU_VERSION=$branch.${{ github.run_number }}-$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure
        run: cmake -S . -B build -A x64 "-DGPU_VERSION=${{ env.GPU_VERSION }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test naming rules
        run: ctest --test-dir build -C Release --output-on-failure
      # 창 없이 실제 정리를 돌려 본다: 사진 150개 + 동영상 100개 + 문서 3개 → 001(100) 002(100) 003(50), 문서는 제자리.
      # 같은 드라이브(D: → D:)와 다른 드라이브(D: → C:) 모두: 원본이 남지 않고, 내용·만든 날짜·수정 날짜가 그대로인지 확인한다.
      - name: Organize smoke test
        shell: pwsh
        run: |
          function Test-Organize([string]$name, [string]$dest) {
            $src = Join-Path $env:RUNNER_TEMP "$name-src"
            New-Item -ItemType Directory -Force "$src\a\sub", "$src\b" | Out-Null
            1..150 | ForEach-Object { Set-Content "$src\a\sub\IMG_$_.JPG" "photo-a-$_" }
            1..100 | ForEach-Object { Set-Content "$src\b\VID_$_.mp4" "video-b-$_" }
            1..3 | ForEach-Object { Set-Content "$src\b\note_$_.txt" "note-$_" }
            # 날짜를 서로 다르게 만들어 두고, 옮긴 뒤 그대로인지 내용 해시로 짝지어 비교한다.
            $i = 0
            $before = @{}
            Get-ChildItem $src -Recurse -File -Include *.jpg, *.mp4 | ForEach-Object {
              $i++
              $_.CreationTime = (Get-Date '2015-03-01').AddHours($i)
              $_.LastWriteTime = (Get-Date '2016-03-01').AddHours($i)
              $before[(Get-FileHash $_.FullName).Hash] = @($_.CreationTime, $_.LastWriteTime)
            }
            $p = Start-Process -FilePath build\Release\Google-Photo-Uploader.exe -ArgumentList '--organize','--dest',"`"$dest`"","`"$src\a`"","`"$src\b`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "[$name] unexpected exit code $($p.ExitCode)" }
            $run = Get-ChildItem $dest -Directory | Select-Object -First 1
            $chunks = Get-ChildItem $run.FullName -Directory | Sort-Object Name
            $counts = ($chunks | ForEach-Object { (Get-ChildItem $_.FullName -File).Count }) -join ','
            Write-Host "[$name] run=$($run.Name) chunks=$($chunks.Name -join ',') counts=$counts"
            if (($chunks.Name -join ',') -ne '001,002,003' -or $counts -ne '100,100,50') { throw "[$name] unexpected chunks" }
            $files = Get-ChildItem $run.FullName -Recurse -File
            $bad = $files | Where-Object { $_.Name -notmatch '^\d{4}_\d{2}_\d{2}_\d{2}_[0-9a-f]{8}(_\d+)?\.(jpg|mp4)$' }
            if ($bad) { throw "[$name] unexpected names: $($bad.Name -join ', ')" }
            if ((Get-ChildItem $src -Recurse -File -Include *.jpg, *.mp4).Count -ne 0) { throw "[$name] media left in source" }
            if ((Get-ChildItem $src -Recurse -File -Include *.txt).Count -ne 3) { throw "[$name] non-media files were moved" }
            # 오래된 것부터: 앞 폴더의 마지막 시각 <= 뒤 폴더의 첫 시각
            for ($c = 1; $c -lt $chunks.Count; $c++) {
              $prev = (Get-ChildItem $chunks[$c - 1].FullName -File | Sort-Object Name | Select-Object -Last 1).Name.Substring(0, 13)
              $next = (Get-ChildItem $chunks[$c].FullName -File | Sort-Object Name | Select-Object -First 1).Name.Substring(0, 13)
              if ($prev -gt $next) { throw "[$name] chunk order $prev > $next" }
            }
            foreach ($f in $files) {
              $t = $before[(Get-FileHash $f.FullName).Hash]
              if (-not $t) { throw "[$name] content changed: $($f.Name)" }
              if ($f.CreationTime -ne $t[0] -or $f.LastWriteTime -ne $t[1]) { throw "[$name] dates changed: $($f.Name) $($f.CreationTime) $($f.LastWriteTime)" }
            }
            Write-Host "[$name] content and dates preserved for $($files.Count) files"
          }
          Test-Organize 'same-drive' (Join-Path $env:RUNNER_TEMP 'smoke-dest')
          Test-Organize 'other-drive' 'C:\smoke-dest'
      # 가짜 adb(폰 흉내)로 업로드 흐름 전체를 확인한다: 복사 → 변동 없음 대기 → PC '업로드 완료'로 이동 → 폰에서 삭제 → 다음 묶음.
      - name: Upload smoke test (fake phone)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'upload-bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item build\Release\Google-Photo-Uploader.exe $bin
          Copy-Item build\Release\fake_adb.exe "$bin\adb.exe"
          function New-Run([string]$name, [int[]]$counts) {
            $run = Join-Path $env:RUNNER_TEMP $name
            for ($c = 0; $c -lt $counts.Count; $c++) {
              $dir = Join-Path $run ('{0:D3}' -f ($c + 1))
              New-Item -ItemType Directory -Force $dir | Out-Null
              1..$counts[$c] | ForEach-Object { Set-Content "$dir\2024_01_0$($c + 1)_1$($_)_$('{0:x8}' -f ($c * 100 + $_)).jpg" "$name-$c-$_" }
            }
            return $run
          }
          function Assert-Uploaded([string]$name, [string]$run, [string]$phone, [int]$total) {
            Get-Content "$run\upload-log.txt" -Encoding utf8 | ForEach-Object { Write-Host "[$name] $_" }
            $done = @(Get-ChildItem (Join-Path $run '업로드 완료') -Recurse -File).Count
            $left = @(Get-ChildItem $run -Directory | Where-Object Name -match '^\d{3}$' | Get-ChildItem -File).Count
            $onPhone = @(Get-ChildItem "$phone\sdcard\DCIM\Camera" -File -ErrorAction SilentlyContinue).Count
            Write-Host "[$name] uploaded=$done left=$left onPhone=$onPhone"
            if ($done -ne $total -or $left -ne 0 -or $onPhone -ne 0) { throw "[$name] unexpected upload result" }
          }

          # 묶음 2개씩, 변동 없음 2초: 5개 → 3묶음
          $run = New-Run 'up-batch' @(3, 2)
          $env:FAKE_ADB_ROOT = Join-Path $env:RUNNER_TEMP 'phone-batch'
          New-Item -ItemType Directory -Force $env:FAKE_ADB_ROOT | Out-Null
          $p = Start-Process "$bin\Google-Photo-Uploader.exe" -ArgumentList '--upload','--dir',"`"$run`"",'--batch','2','--quiet-seconds','2' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "[batch] exit code $($p.ExitCode)" }
          Assert-Uploaded 'batch' $run $env:FAKE_ADB_ROOT 5
          $pushes = @(Select-String -Path "$env:FAKE_ADB_ROOT\calls.log" -Pattern '^-s \| FAKE0001 \| push').Count
          if ($pushes -ne 5) { throw "[batch] expected 5 pushes, got $pushes" }

          # 슬로우(1개씩) + 백업 중 알림: 알림이 있는 동안은 완료로 보지 않아야 한다
          $run = New-Run 'up-slow' @(2)
          $env:FAKE_ADB_ROOT = Join-Path $env:RUNNER_TEMP 'phone-slow'
          New-Item -ItemType Directory -Force $env:FAKE_ADB_ROOT | Out-Null
          @(
            '  Notification List:',
            '    NotificationRecord(0x1: pkg=com.google.android.apps.photos user=UserHandle{0} id=1 tag=null importance=2 key=k: Notification(channel=backup pri=-1 flags=0x62 category=progress))',
            '      extras={',
            '        android.title=String (Backing up)',
            '        android.progress=Integer (0)',
            '        android.progressMax=Integer (1)',
            '      }'
          ) | Set-Content "$env:FAKE_ADB_ROOT\notification.txt"
          $p = Start-Process "$bin\Google-Photo-Uploader.exe" -ArgumentList '--upload','--dir',"`"$run`"",'--batch','1','--quiet-seconds','2' -PassThru
          Start-Sleep -Seconds 12
          if (Test-Path (Join-Path $run '업로드 완료')) { throw '[slow] completed while Google Photos was still backing up' }
          if (@(Get-ChildItem "$env:FAKE_ADB_ROOT\sdcard\DCIM\Camera" -File).Count -ne 1) { throw '[slow] expected exactly 1 file on phone' }
          Remove-Item "$env:FAKE_ADB_ROOT\notification.txt"
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw '[slow] did not finish' }
          if ($p.ExitCode -ne 0) { throw "[slow] exit code $($p.ExitCode)" }
          Assert-Uploaded 'slow' $run $env:FAKE_ADB_ROOT 2

          # 완료 폴더 지정 (다른 드라이브 C:): <완료 폴더>\<실행 폴더 이름>\NNN 으로 옮기고 날짜를 보존해야 한다
          $run = New-Run 'up-done' @(2, 1)
          $stamp = Get-Date '2015-06-01 10:00'
          Get-ChildItem $run -Recurse -File | ForEach-Object { $_.CreationTime = $stamp; $_.LastWriteTime = $stamp }
          $doneDir = 'C:\upload-done'
          $env:FAKE_ADB_ROOT = Join-Path $env:RUNNER_TEMP 'phone-done'
          New-Item -ItemType Directory -Force $env:FAKE_ADB_ROOT | Out-Null
          $p = Start-Process "$bin\Google-Photo-Uploader.exe" -ArgumentList '--upload','--dir',"`"$run`"",'--done-dir',"`"$doneDir`"",'--batch','2','--quiet-seconds','2' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "[done-dir] exit code $($p.ExitCode)" }
          Get-Content "$run\upload-log.txt" -Encoding utf8 | ForEach-Object { Write-Host "[done-dir] $_" }
          $moved = @(Get-ChildItem "$doneDir\up-done" -Recurse -File)
          Write-Host "[done-dir] moved=$($moved.Count) chunks=$((Get-ChildItem "$doneDir\up-done" -Directory).Name -join ',')"
          if ($moved.Count -ne 3) { throw '[done-dir] expected 3 files in done folder' }
          if (Test-Path (Join-Path $run '업로드 완료')) { throw '[done-dir] default folder should not be used' }
          if (@(Get-ChildItem $run -Directory | Where-Object Name -match '^\d{3}$').Count -ne 0) { throw '[done-dir] chunk folders left' }
          foreach ($f in $moved) { if ($f.CreationTime -ne $stamp -or $f.LastWriteTime -ne $stamp) { throw "[done-dir] dates changed: $($f.Name)" } }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, zip | Out-Null
          # adb (Google platform-tools): 폰 업로드에 쓴다. 앱과 같은 폴더에 둔다.
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath . -Force
          foreach ($f in 'adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll') { Copy-Item "platform-tools\$f" "zip\$f" }
          & zip\adb.exe version
          if ($LASTEXITCODE -ne 0) { throw 'adb does not run' }
          & zip\adb.exe kill-server
          # zip: 실행 파일 + 사용 설명서 + 빌드 이름. 파일 이름에 빌드 이름을 넣어 받은 파일의 버전을 바로 알 수 있게 한다.
          Copy-Item build/Release/Google-Photo-Uploader.exe zip/Google-Photo-Uploader.exe
          Copy-Item README.md zip/README.md
          "Google-Photo-Uploader ${{ env.GPU_VERSION }}`r`ncommit ${{ github.sha }}" | Out-File -FilePath zip/VERSION.txt -Encoding utf8
          # 압축 시작 시각(한국 시간, 년-월-일-시-분)을 파일 이름에 넣는다.
          $kst = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Korea Standard Time').ToString('yyyy-MM-dd-HH-mm')
          Compress-Archive -Path zip/* -DestinationPath "dist/Google-Photo-Uploader-$kst-${{ env.GPU_VERSION }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Google-Photo-Uploader-Windows-x64
          path: dist/
          retention-days: 14

  release:
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Google-Photo-Uploader-Windows-x64
          path: dist
      - name: Replace the main release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $repo = '${{ github.repository }}'
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $build = "main.${{ github.run_number }}-$sha"
          $zip = Get-ChildItem dist -Filter 'Google-Photo-Uploader-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'versioned zip not found' }
          $zipName = $zip.Name
          $notes = @"
          Google-Photo-Uploader — main 최신 빌드 ``$build``. 창 제목에 같은 빌드 이름이 표시됩니다.

          받을 파일: **$zipName** — 압축을 풀고 Google-Photo-Uploader.exe를 실행하세요(설치 없음, 사용 설명서 README.md 포함). 아래 "Source code" 압축은 GitHub가 자동으로 붙이는 소스라 받을 필요가 없습니다.

          ① 정리: 폴더 여러 개를 창에 끌어다 놓거나 [폴더 추가]로 고른 뒤 [완료]를 누르세요.
          사진·동영상을 촬영 시각 순으로 100개씩 나눠 <저장 폴더>\<실행 시각>\001, 002 ... 로 옮기고, 파일 이름을 년_월_일_시_해쉬.확장자 로 바꿉니다.
          ② 폰 업로드: Pixel 폰을 USB 디버깅으로 연결하고 [업로드 시작]. 묶음(슬로우 1개 / 50개 / 100개)씩 폰 DCIM/Camera에 넣고,
          Google 포토 알림에 정한 시간 동안 변동이 없으면 PC 파일을 '업로드 완료' 폴더로 옮기고 폰 사본을 지운 뒤 다음 묶음을 넣습니다. (adb 포함)

          서명되지 않은 실행 파일이라 SmartScreen 경고가 뜨면 [추가 정보] → [실행]을 누르세요. 빌드: ${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}
          "@
          # 같은 Release를 지우고 같은 태그 이름으로 다시 만든다 → 다운로드 주소는 그대로, 파일만 최신으로 바뀐다.
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $repo --cleanup-tag --yes }
          gh release create $tag $zip.FullName --repo $repo --target '${{ github.sha }}' --title "Google-Photo-Uploader (main)" --notes $notes --latest
